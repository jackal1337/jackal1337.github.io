<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protiproud – Článek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="container py-3 mb-4 border-bottom">
        <div class="d-flex justify-content-between align-items-center">
            <a href="index.html" class="d-flex align-items-center text-decoration-none">
                <img src="logo.png" alt="Protiproud" height="40" class="logo">
            </a>
            <div class="tagline-container">
                <div id="tagline" class="tagline"></div>
            </div>
            <button id="theme-toggle" class="btn btn-outline-secondary">
                <span class="light-mode-icon">🌙</span>
                <span class="dark-mode-icon" style="display: none">☀️</span>
            </button>
        </div>
    </header>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div id="article-detail" class="article-detail">
                    <p>Načítání článku...</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="container mt-5 py-3 border-top text-center text-muted">
        &copy; 2025 Protiproud<br>Provozovatel webové stránky protiproud.ic je PO Tixor, IČ 581
    </footer>

    <!-- Back to Top Button -->
    <button id="back-to-top" class="back-to-top" aria-label="Zpět nahoru">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" aria-label="Zavřít">&times;</button>
        <img class="lightbox-img" src="" alt="">
    </div>

    <script src="js/script.js"></script>
</body>

</html>
