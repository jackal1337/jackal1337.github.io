<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Místa · ObjevujTo</title>
  <meta name="description" content="Přehled míst a filtrů pro ObjevujTo.">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header class="site-nav" data-site-nav></header>
  <main class="site-shell">
    <section class="page-hero section">
      <span class="eyebrow">Atlas míst</span>
      <h1>Místa a lokality</h1>
      <p>Přehled obcí, čtvrtí i výletních zastávek na jednom místě. Stačí si vybrat region nebo téma, které tě zrovna zajímá.</p>
    </section>

    <section class="section">
      <form class="filter-panel" data-filters-form>
        <div class="section-head">
          <div>
            <h2>Filtry</h2>
            <p data-places-summary>Načítám výsledky…</p>
          </div>
          <button class="button button--ghost" type="submit">Použít filtry</button>
        </div>
        <div class="filter-grid">
          <input class="input" type="search" name="q" placeholder="Hledat podle názvu nebo tématu">
          <select class="select" name="region"></select>
          <select class="select" name="category"></select>
          <select class="select" name="tag"></select>
        </div>
      </form>
    </section>

    <section class="section">
      <div class="card-grid" data-places-list></div>
    </section>
  </main>

  <footer class="footer" data-site-footer></footer>
  <script type="module" src="assets/js/pages/places.js"></script>
</body>
</html>
