<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Místa · ObjevujTo</title>
  <meta name="description" content="Přehled míst a filtrů pro ObjevujTo.">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <header class="site-nav" data-site-nav></header>
  <main class="site-shell">
    <section class="page-hero section page-hero--listing">
      <span class="eyebrow">Atlas míst</span>
      <h1>Místa a lokality</h1>
      <p>Přehled obcí, čtvrtí i výletních zastávek na jednom místě. Můžeš jít přes tři hlavní obce, nebo přes společný blok dalších částí San Andreas.</p>
    </section>

    <section class="section listing-layout">
      <aside class="filter-panel filter-panel--sticky">
        <div class="section-head section-head--compact">
          <div>
            <h2>Filtry</h2>
            <p data-places-summary>Načítám výsledky…</p>
          </div>
        </div>
        <form class="filter-stack" data-filters-form>
          <input class="input" type="search" name="q" placeholder="Hledat podle názvu nebo tématu">
          <select class="select" name="region"></select>
          <select class="select" name="category"></select>
          <select class="select" name="tag"></select>
          <button class="button button--primary" type="submit">Použít filtry</button>
        </form>
        <div class="filter-note">
          <strong>Rychlá volba</strong>
          <div class="quick-group-links">
            <a href="places.html?group=core-towns">Montgomery, Blueberry, Palomino Creek</a>
            <a href="places.html?group=others">Další části San Andreas</a>
          </div>
        </div>
      </aside>

      <div class="listing-content">
        <div class="active-filters" data-active-filters></div>
        <div class="listing-group-grid" data-places-list></div>
      </div>
    </section>
  </main>

  <footer class="footer" data-site-footer></footer>
  <script type="module" src="assets/js/pages/places.js"></script>
</body>
</html>
