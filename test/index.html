<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulář pro Discord Bot</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Formulář pro Discord Bot</h1>
        <form id="discordForm">
            <div class="form-group">
                <label for="username">Uživatelské jméno:</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="form-group">
                <label for="message">Zpráva:</label>
                <textarea class="form-control" id="message" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Odeslat</button>
        </form>
    </div>

    <!-- Bootstrap JS and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        // Po načtení stránky
        document.addEventListener('DOMContentLoaded', function() {
            // Při odeslání formuláře
            document.getElementById('discordForm').addEventListener('submit', function(event) {
                event.preventDefault(); // Zabrání výchozímu odeslání formuláře

                // Získej hodnoty z formuláře
                var username = document.getElementById('username').value;
                var message = document.getElementById('message').value;

                // Zde bys měl mít svůj Discord bot token
                var botToken = '-liaoVjg2QXOwJuAwYtjCkDp_t_2nY_L';

                // Vytvoř embed JSON objekt
                var embed = {
                    "username": "Web Form Bot",
                    "avatar_url": "https://i.imgur.com/4M34hi2.png", // Obrázek pro bota
                    "content": "Nový formulářový vstup:",
                    "embeds": [
                        {
                            "title": "Nová zpráva",
                            "color": 16711680,
                            "fields": [
                                {
                                    "name": "Uživatel",
                                    "value": username,
                                    "inline": true
                                },
                                {
                                    "name": "Zpráva",
                                    "value": message,
                                    "inline": true
                                }
                            ]
                        }
                    ]
                };

                // Odešli data na Discord
                fetch('https://discord.com/api/webhooks/1161427676310016123/MTE2MTQyNzY3NjMxMDAxNjEyMw.Grjy9C.bwL_-jrAW6tp3nsGuB321W5eSC9l_C5PCnfMSU', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(embed)
                })
                .then(response => {
                    if (response.ok) {
                        alert('Zpráva byla úspěšně odeslána na Discord!');
                        document.getElementById('username').value = '';
                        document.getElementById('message').value = '';
                    } else {
                        alert('Něco se pokazilo. Zpráva nebyla odeslána.');
                    }
                })
                .catch(error => {
                    console.error('Chyba při odesílání na Discord:', error);
                    alert('Chyba při odesílání na Discord.');
                });
            });
        });
    </script>
</body>
</html>
