<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Doprava.ic</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"
        crossorigin="anonymous"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        referrerpolicy="no-referrer">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
    <div class="text-center mb-4 p-2">
        <h1 class="text-primary text-uppercase"><i class="fas fa-car"></i> Doprava.ic</h1>
        <!-- Button to trigger modal -->
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal">
            Open Modal
        </button>
    </div>

    <!-- The Modal -->
    <div class="modal fade" id="myModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title">Podmínky užití služby</h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>

                <!-- Modal body -->
                <div class="modal-body">
                    Modal content goes here...
                </div>

            </div>
        </div>
    </div>
    <section class="container">
        <h2 class="text-primary"><i class="fas fa-pencil-alt"></i> Záznam události</h2>
        <form id="recordForm">
            <div class="form-group"><input class="form-control" id="location" name="location" placeholder="Lokace"
                    required></div>
            <div class="form-group"><textarea class="form-control" id="description" name="description"
                    placeholder="Popis situace" required></textarea></div>
            <div class="form-group"><select class="form-control" id="police_presence" name="police_presence" required>
                    <option value="" disabled hidden selected>Policie přítomna</option>
                    <option value="yes">Ano</option>
                    <option value="no">Ne</option>
                </select></div>
            <div class="form-group"><select class="form-control" id="event_type" name="event_type" required>
                    <option value="" disabled hidden selected>Typ události</option>
                    <option value="nehoda">Dopravní nehoda</option>
                    <option value="hlidka">Policejní hlídka</option>
                    <option value="prekazka">Překážka na silnici</option>
                </select></div>
            <div class="form-group"><input class="form-control" id="imageLink" name="imageLink"
                    placeholder="Fotografie (odkaz na Imgur)"></div>
            <div class="form-group"><input class="form-control" id="name" name="name" placeholder="Jméno oznamovatele">
            </div>
            <button class="btn btn-primary" id="submitButton" type="submit">Odeslat</button>
        </form>
    </section>
    <section class="container">
        <h2 class="text-primary"><i class="fas fa-clipboard-list"></i> Seznam Záznamů</h2>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Datum a čas</th>
                        <th scope="col">Lokace</th>
                        <th scope="col">Popis situace</th>
                        <th scope="col">Policie přítomna</th>
                        <th scope="col">Typ události</th>
                        <th scope="col">Jméno oznamovatele</th>
                        <th scope="col">Obrázek</th>
                    </tr>
                </thead>
                <tbody id="recordListBody">
                </tbody>
            </table>
        </div>
    </section>    
    <footer>
        <div class="my-5 px-lg-5">
            <p class="text-center text-muted">Provozovatel webové stránky docar.ic je PO Tixor, IČ 581<br>Design&Code by
                <a href="https://artic.leosight.cz/iris.ic/donnie" target="_top">Donato Ortiz</a>
            </p>
        </div>
    </footer>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script type="module" src="assets/js/main.js"></script>
